profile: once-google
workdir: .colors

once:
  applications:
    - host: google.bigconfig.online
      image: ghcr.io/getcolors/colors-website:latest

provider-compute: google
provider-smtp: resend
provider-dns: cloudflare
provider-backend: r2
compute-prevent-destroy: true

google-project: once-504515
google-region: europe-west4
google-zone: europe-west4-b
google-name: once-google
google-machine-type: t2a-standard-1
google-image-project: ubuntu-os-cloud
google-image-family: ubuntu-2404-lts-arm64
google-image-id: projects/ubuntu-os-cloud/global/images/ubuntu-2404-noble-arm64-v20260723
google-subnet-cidr: 10.20.1.0/24
google-boot-disk-size-gb: 30
google-ssh-authorized-keys: ~/.ssh/id_ed25519.pub

# Existing resources require explicit state transfer before create.
compute-require-existing-state: true

# Shared workspace R2 state backend; credentials stay in the environment.
r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com

# Explicit public IPv4 SSH and web policy for the shared compute request.
compute-ssh-sources: [0.0.0.0/0]
compute-http-sources: [0.0.0.0/0]
